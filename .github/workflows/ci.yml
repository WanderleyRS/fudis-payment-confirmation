name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "FudisTest!2026"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'FudisTest!2026' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    env:
      # The same suite runs on Linux against a real SQL Server, not only on Windows with LocalDB.
      FUDIS_TEST_CONNECTION: "Server=localhost,1433;Database=FudisPaymentsTests;User Id=sa;Password=FudisTest!2026;Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=True"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build --nologo -v q

      - name: Test
        run: dotnet test --nologo -v q
